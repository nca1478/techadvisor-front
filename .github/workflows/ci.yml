# Frontend CI — lint + typecheck + tests + build + e2e (no backend dependency:
# the committed src/lib/api/schema.d.ts lets the build compile standalone,
# unit tests mock fetch, and the Phase 0 e2e smoke covers the static home).
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
